# On every push and pull request: formatting, clippy, tests and the drawn icon, on Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stable Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

      - name: The icon is up to date with tools/icon
        shell: bash
        run: cargo run -p icon && git diff --exit-code -- assets docs
