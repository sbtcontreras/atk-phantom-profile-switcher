# En cada push y pull request: formato, clippy y pruebas, en Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust estable
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Formato
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Pruebas
        run: cargo test
