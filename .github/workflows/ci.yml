# On every push and pull request: formatting, clippy and tests, on Windows.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Stable Rust
        run: rustup update stable && rustup default stable && rustup component add rustfmt clippy

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test
