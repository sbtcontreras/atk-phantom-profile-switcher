# Pushing a tag vX.Y.Z runs the tests, builds the .exe on Windows from this code, signs it and
# publishes it on Releases with its signature and SHA-256. The release notes are that version's
# section of CHANGELOG.md. 0.x versions are published as pre-releases; the app offers only the
# others (src/update), and installs one only with its signature (tools/sign), made with the
# repository's secret PHANTOM_SIGNING_KEY.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version and release notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the version in Cargo.toml."
            exit 1
          fi
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[0-9]/) { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      - name: Stable Rust
        run: rustup update stable && rustup default stable

      - name: Tests
        run: cargo test --locked

      - name: Build
        run: cargo build --locked --release

      # Fails without the secret, or with one that is not the key the app carries.
      - name: Sign
        shell: bash
        env:
          PHANTOM_SIGNING_KEY: ${{ secrets.PHANTOM_SIGNING_KEY }}
        run: |
          cp target/x86_64-pc-windows-msvc/release/PhantomSwitch.exe .
          cargo run --locked -p sign -- PhantomSwitch.exe

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum PhantomSwitch.exe > PhantomSwitch.exe.sha256
          prerelease=""
          case "$GITHUB_REF_NAME" in v0.*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" PhantomSwitch.exe PhantomSwitch.exe.sig PhantomSwitch.exe.sha256 \
            --title "Phantom Switch ${GITHUB_REF_NAME}" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
