# Built for Windows (from WSL with cargo-xwin, or on Windows itself), with the C runtime inside
# the .exe: nothing needs to be installed to run it.
[build]
target = "x86_64-pc-windows-msvc"

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-arg=/ignore:4099"]
