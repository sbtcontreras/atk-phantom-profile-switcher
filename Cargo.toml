[package]
name = "atk-phantom-profile-switcher"
version = "0.1.0"
edition = "2024"
description = "Cambia las configuraciones internas del ATK Phantom Ultimate desde la bandeja de Windows, sin ATK HUB."
license = "MIT"
repository = "https://github.com/sbtcontreras/atk-phantom-profile-switcher"
publish = false

[[bin]]
name = "AtkPhantomModo"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
