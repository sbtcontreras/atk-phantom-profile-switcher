[package]
name = "atk-phantom-profile-switcher"
version = "1.1.0"
description = "Phantom Switch: switch the ATK Phantom Ultimate's onboard profiles from the Windows tray."
repository = "https://github.com/sbtcontreras/atk-phantom-profile-switcher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "PhantomSwitch"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Devices_DeviceAndDriverInstallation",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_IO",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true

[workspace]
members = ["tools/icon", "tools/sign"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
